spring.application.name=bikeStrava
server.port=8086

# Sekrety (client-id/secret) sa w pliku application-local.properties (poza gitem).
spring.config.import=optional:classpath:application-local.properties

strava.client-id=${STRAVA_CLIENT_ID:}
strava.client-secret=${STRAVA_CLIENT_SECRET:}
strava.redirect-uri=http://localhost:8086/api/auth/callback
strava.scope=activity:read
strava.oauth-base-url=https://www.strava.com/oauth
strava.api-base-url=https://www.strava.com/api/v3
strava.activities-limit=10
# Tutaj aplikacja zapisuje tokeny po autoryzacji (access/refresh) - plik poza gitem.
strava.token-file=./strava-tokens.json
